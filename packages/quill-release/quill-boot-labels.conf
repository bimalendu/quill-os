# Quill OS: give /boot its SELinux labels at every boot.
#
# Image builders that run without SELinux (CI runners, a build VM with
# selinux=0) leave the files they create in /boot - grub.cfg, the boot loader
# entry, lost+found - unlabelled, and systemd-logind is then denied reading
# them. "Z" with no mode, user or group only restores the SELinux context,
# recursively. /boot/efi is a separate FAT mount, which tmpfiles leaves alone.
Z /boot - - -
